<!-- ============================================================
     SLATE SPIKE 0 — the script-free probe

     Use this when the other three spikes stay stuck on "checking…":
     that means the Slate widget strips or refuses to run the OUTER
     <script> those files use to report their own verdict. That is
     an instrumentation failure, not a verdict — the bundle produced
     by `tools/bundle.js --mode=slate` needs no outer script at all.
     It is an <iframe srcdoc> whose scripts live INSIDE the frame.

     This file therefore contains no script outside the frame. It
     renders its own answer as plain text inside the frame, so it
     works even in a widget that sanitises scripts.

     Paste the whole file into a Slate HTML/Text widget, save and
     publish, then open the View mode and read the box.

       Nothing at all renders   






























































































































                                  RED. Hosting required.
       Empty bordered box       
                                  RED. Hosting required.
       "1. MARKUP OK" +
       "2. SCRIPT BLOCKED"      
                                  AMBER. CSP forbids inline script
                                  in framed documents. The bundle
                                  cannot run. Hosting required.
                                  Capture the console error.
       "1. MARKUP OK" +
       "2. SCRIPT RAN"          
                                  GREEN. The approach works. Line 3
                                  tells you whether localStorage is
                                  available; the app falls back to
                                  in-memory storage if not.

     See FOUNDRY_REQUESTS.md §1 for what "hosting required" means.
     ============================================================ -->
<div style="font:14px/1.5 system-ui,sans-serif;padding:12px">
  <div style="font-weight:600;margin-bottom:8px">Slate spike 0 — script-free srcdoc probe</div>
  <iframe title="script-free probe"
          style="width:100%;height:110px;border:1px solid #ccc;border-radius:6px;background:#fff"
          srcdoc="&lt;!doctype html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;/head&gt;&lt;body style=&quot;font:13px/1.6 system-ui,sans-serif;margin:0;padding:10px;background:#f6f7f9&quot;&gt;&lt;div style=&quot;color:#1b7f4b;font-weight:600&quot;&gt;1. MARKUP OK&lt;/div&gt;&lt;div id=&quot;s&quot; style=&quot;color:#b3261e;font-weight:700&quot;&gt;2. SCRIPT BLOCKED&lt;/div&gt;&lt;div id=&quot;t&quot; style=&quot;color:#666&quot;&gt;3. storage: unknown&lt;/div&gt;&lt;script&gt;var e=document.getElementById('s');e.textContent='2. SCRIPT RAN';e.style.color='#1b7f4b';var t=document.getElementById('t');try{localStorage.setItem('__p__','1');localStorage.removeItem('__p__');t.textContent='3. storage: localStorage available';}catch(x){t.textContent='3. storage: localStorage blocked ('+x.name+') - app falls back to memory';}&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
  <div style="margin-top:8px;font-size:12px;color:#666">
    Read the three lines inside the box above. Nothing here depends on a script
    outside the frame, so this works even where spikes 1–3 stay silent.
  </div>
</div>
